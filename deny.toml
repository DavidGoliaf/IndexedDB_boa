[advisories]
db-path = "$CARGO_DENY_DB_PATH"
db-urls = ["https://github.com/RustSec/advisory-db"]

[licenses]
# Note: the `unlicensed = "reject"` key was removed upstream (cargo-deny #611);
# unlicensed crates are rejected by default in current cargo-deny versions.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
