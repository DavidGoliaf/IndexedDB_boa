name: Bench regression gate (>10% vs labelled baseline)

# BLOCKING performance gate (M7-B P1-1): fails the check when any criterion
# scenario regresses more than 10% against the LABELLED baseline
# (crates/boa_idb/benches/baselines/m7b-label-baseline.json). That file is
# captured on the pinned self-hosted runner and does NOT exist in the repo
# until then — the comparator fails closed (exit 2) on a missing, interim
# or incomplete baseline, so the gate can never silently pass.
#
# Trigger: pull requests targeting `main` (the set the gate is required
# for), plus weekly schedule and manual dispatch. The `pull_request` event
# publishes the check status on the PR SHA by construction; repo admins
# must additionally list `bench-regression` in required checks (EXTERNAL,
# maintainer-owned — see Residual in docs/reviews/M7B-handoff.md).
#
# The job runs ONLY on the pinned runner (labels: self-hosted, bench).
# Heterogeneous runners must never enforce or quote these numbers.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bench-regression:
    runs-on: [self-hosted, bench]
    timeout-minutes: 120
    concurrency:
      group: bench-regression-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-benchreg-${{ hashFiles('**/Cargo.lock') }}
      - name: Compare against labelled baseline (blocking)
        run: >
          python3 scripts/bench_compare.py compare
          --baseline crates/boa_idb/benches/baselines/m7b-label-baseline.json
          2>&1 | tee bench-compare.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-compare-log
          path: bench-compare.log
