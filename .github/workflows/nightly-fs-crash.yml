name: Nightly FS crash consistency

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  crash-consistency:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-crash-${{ hashFiles('**/Cargo.lock') }}
      - name: FS crash worker 200 seeded iterations
        shell: bash
        run: |
          export BOA_IDB_FS_CRASH_ITERS=200
          export BOA_IDB_FS_CRASH_SEED=0xC0FFEE
          cargo test -p boa_idb_fs --test m6b3_crash_tests -- --nocapture
