name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Fetch RustSec advisory database
        shell: bash
        run: |
          export CARGO_DENY_DB_PATH="$GITHUB_WORKSPACE/target/cargo-deny-advisories"
          echo "CARGO_DENY_DB_PATH=$CARGO_DENY_DB_PATH" >> "$GITHUB_ENV"
          cargo deny fetch db
      - name: Check dependencies
        run: cargo deny check
      - name: Check Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace
          cargo test -p boa_idb --features tracing --test observer_tests
      - name: Strict documentation (no warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: Comparator unit tests (bench gate)
        run: python3 scripts/test_bench_compare.py
  bench-smoke:
    # Diagnostic only: heterogeneous runners must never be quoted as release
    # evidence. The authoritative baseline comparison (blocking >10 %
    # regression gate) lives on the pinned benchmark host (M7-B).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: Benchmark smoke (reduced scale)
        env:
          BOA_IDB_BENCH_SMOKE: 1
        run: cargo bench -p boa_idb --bench backends
